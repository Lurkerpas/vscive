name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build extension
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload built extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscive-extension-vsix
          path: ./*.vsix
          if-no-files-found: error
